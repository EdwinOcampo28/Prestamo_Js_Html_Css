<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simulador de Prestamos</title>
<link rel="stylesheet" href="styles.css">

<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>

<div class="container">

<h1>Simulador de Prestamos</h1>

<section class="cards">
<div class="card"><h3>Saldo pendiente</h3><p id="saldoPendiente">$0</p></div>
<div class="card"><h3>Capital pagado</h3><p id="capitalPagado">$0</p></div>
<div class="card"><h3>Intereses pagados</h3><p id="interesPagado">$0</p></div>
<div class="card"><h3>Total pagado</h3><p id="totalPagado">$0</p></div>
<div class="card"><h3>Progreso</h3><p id="progresoPrestamo">0%</p></div>
<div class="card"><h3>Intereses ahorrados</h3><p id="interesAhorrado">$0</p></div>
</section>

<div class="barra-container">
  <div id="barraProgreso"></div>
</div>

<section class="formulario">
<input type="number" id="monto" value="2200000" min="1">
<input type="number" id="interes" value="24" min="0" step="0.01">
<input type="number" id="cuotas" value="29" min="1">
<input type="number" id="diaPago" value="15" min="1" max="31">
</section>

<section class="abono">
<input type="number" id="abonoCapital" placeholder="Valor a abonar al capital" min="1">

<button type="button" id="btnAbono">Aplicar abono</button>
</section>

<section class="botones">
<button type="button" id="btnCalcular">Calcular prestamo</button>
<button type="button" id="btnReiniciar">Reiniciar</button>
<button type="button" id="btnPDF">Descargar PDF</button>
</section>

<section class="tabla-container">
<div class="tabla-wrapper">
<table id="tablaPrincipal">
<tbody id="tabla"></tbody>
</table>
</div>
</section>

<section class="comparador">
<h3>Comparacion del prestamo</h3>

<div class="comparador-grid">
<div class="comparador-card">
<p>Interes total</p>
<strong id="interesOriginal">$0</strong>
</div>

<div class="comparador-card">
<p>Interes con abono</p>
<strong id="interesConAbono">$0</strong>
</div>

<div class="comparador-card ahorro">
<p>Ahorro total</p>
<strong id="ahorroTotal">$0</strong>
</div>
</div>

</section>

<section class="historial">
<h3>Historial de abonos</h3>
<div id="listaAbonos"></div>
</section>

</div>

<script defer src="Calculadora.Js"></script>
<script defer src="Calcular.js"></script>
<script defer src="PagarCuota.js"></script>
<script defer src="prepararYValidarAbono.js"></script>
<script defer src="recalcularYRenderizar.js"></script>
<script defer src="aplicarAbono.js"></script>
<script defer src="recalcularCuota.js"></script>
<script defer src="recalcularPlazo.js"></script>
<script defer src="ReiniciarPrestamo.js"></script>
<script defer src="Pdf.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const btnCalcular = document.getElementById("btnCalcular");
  const btnReiniciar = document.getElementById("btnReiniciar");
  const btnPDF = document.getElementById("btnPDF");
  const btnAbono = document.getElementById("btnAbono");

  btnCalcular?.addEventListener("click", calcular);
  btnReiniciar?.addEventListener("click", reiniciar);
  btnPDF?.addEventListener("click", generarPDF);
  btnAbono?.addEventListener("click", pagarSeparado);
});
</script>

</body>
</html>
