<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Simulador de Préstamos</title>

<link rel="stylesheet" href="styles.css">

<!-- Chart.js -->
<script defer src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- jsPDF -->
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

</head>

<body>

<div class="container">

<h1>Simulador de Préstamos</h1>

<!-- TARJETAS -->
<div class="cards">

<div class="card">
<h3>Saldo pendiente</h3>
<p id="saldoPendiente">$0</p>
</div>

<div class="card">
<h3>Capital pagado</h3>
<p id="capitalPagado">$0</p>
</div>

<div class="card">
<h3>Intereses pagados</h3>
<p id="interesPagado">$0</p>
</div>

<div class="card">
<h3>Total pagado</h3>
<p id="totalPagado">$0</p>
</div>

<div class="card">
<h3>Progreso</h3>
<p id="progresoPrestamo">0%</p>
</div>

</div>

<!-- BARRA PROGRESO -->
<div class="barra-container">
<div id="barraProgreso"></div>
</div>

<!-- FORMULARIO -->
<div class="formulario">

<input
type="number"
id="monto"
placeholder="Monto del préstamo"
value="2200000"
min="1"
/>

<input
type="number"
id="interes"
placeholder="Interés anual (%)"
value="24"
min="0"
/>

<input
type="number"
id="cuotas"
placeholder="Número de cuotas"
value="29"
min="1"
/>

<input
type="number"
id="diaPago"
placeholder="Día de pago"
min="1"
max="31"
value="15"
/>

</div>

<!-- ABONO -->
<div class="abono">

<input
type="number"
id="abonoCapital"
placeholder="Valor a abonar al capital"
min="1"
/>

<select id="tipoAbono">

<option value="cuota">
Reducir cuota
</option>

<option value="plazo">
Reducir plazo
</option>

</select>

<button type="button" id="btnAbono">
Aplicar abono
</button>

</div>

<!-- BOTONES -->
<div class="botones">

<button type="button" id="btnCalcular">
Calcular préstamo
</button>

<button type="button" id="btnReiniciar">
Reiniciar
</button>

<button type="button" id="btnPDF">
Descargar PDF
</button>

</div>

<!-- TABLA -->
<table>

<thead>
<tr>
<th>Cuota</th>
<th>Fecha pago</th>
<th>Pago</th>
<th>Interés</th>
<th>Capital</th>
<th>Saldo</th>
<th>Estado</th>
<th>Acción</th>
</tr>
</thead>

<tbody id="tabla">
</tbody>

</table>

<!-- GRÁFICA -->
<div class="grafica-container">
<canvas id="grafica"></canvas>
</div>

</div>

<!-- SCRIPTS -->
<script defer src="Calculadora.js"></script>
<script defer src="Pdf.js"></script>

<script>

document.addEventListener("DOMContentLoaded", () => {

const btnCalcular = document.getElementById("btnCalcular");
const btnReiniciar = document.getElementById("btnReiniciar");
const btnPDF = document.getElementById("btnPDF");
const btnAbono = document.getElementById("btnAbono");

if(btnCalcular) btnCalcular.addEventListener("click", calcular);
if(btnReiniciar) btnReiniciar.addEventListener("click", reiniciar);
if(btnPDF) btnPDF.addEventListener("click", generarPDF);
if(btnAbono) btnAbono.addEventListener("click", pagarSeparado);

});

</script>

</body>
</html>
