<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<title>Simulador</title>

<link rel="stylesheet" href="styles.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

</head>

<body>

<div class="container">

<h1>Simulador de préstamo</h1>

<div class="formulario">

<input type="number" id="monto" placeholder="Monto">

<input type="number" id="interes" placeholder="Interés anual">

<input type="number" id="cuotas" placeholder="Meses">

<input type="number" id="diaPago" min="1" max="31" placeholder="Día pago">

</div>

<div class="botones">

<button onclick="simularPrestamo()">Simular</button>

<button onclick="guardarPrestamo()">Guardar préstamo</button>

<button onclick="volverDashboard()">Volver</button>

</div>

<table>

<thead>

<tr>

<th>Cuota</th>
<th>Fecha</th>
<th>Pago</th>
<th>Interés</th>
<th>Capital</th>
<th>Saldo</th>

</tr>

</thead>

<tbody id="tabla"></tbody>

</table>

<canvas id="grafica"></canvas>

</div>

<script src="app.js"></script>

</body>
</html>
